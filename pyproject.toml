[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snowflake_login"
version = "0.0.1"
description = "snowflake_login"
requires-python = ">=3.13,<3.14"


dependencies = [
    "cryptography>=44",
    "numpy>=2.5.1,<3",
    "pyarrow>=25.0.0,<26",
    "snowflake==1.12.1",
    "snowflake-connector-python>=4.7.1,<5",
]

[tool.hatch.build.targets.wheel]
include = ["connect"]